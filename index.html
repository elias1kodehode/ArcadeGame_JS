<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mega SLAP</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <h1>MEGASLAP</h1>
  <div class="container">
    <div class="info">
      <p>D ← Wrist (paddle) → J</p>
      <p>S ← Elbow → K</p>
      <p>A ← Shoulder → L</p>
      <br>
      <p>Escape = pause</p>
    </div>
    <div class="gamecontainer">
      <canvas id="game"></canvas>
      <div id="game-over-overlay">
        <div id="game-over-top">
          <h1>VICTORY!</h1>
        </div>
        <div id="game-over-middle">

        </div>
        <div id="game-over-bottom">
          <button id="restart-button">Restart</button>
        </div>
      </div>
      <div id="game-start-overlay">
        <p>Controls on the left! Stats on the right!</p>
        <button id="startbutton">START SLAPPING</button>
      </div>
      <div id="game-pause-overlay">
        <h3>PAUSE</h3>
        <p>Press ESC to unpause</p>
        <button id="restart-from-pause">Restart</button>
      </div>
    </div>
    <div class="game-info">
      <div class="current-info">
        <h3>Current:</h3>
        <p>Attempt: <span id="attempt"></span></p>
        <p>Time: <span id="timer"></span></p>
      </div>
      <div class="records">
        <h3>Records:</h3>
        <p>Attempt: <span id="record-attempt"></span></p>
        <p>Time: <span id="record-time"></span></p>
      </div>
    </div>
  </div>
</body>

</html>
